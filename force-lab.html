
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glyphfever — D3 Force Lab</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #F7FAFF;
      text-align: center;
      color: #172B4D;
    }

    svg {
      border: 1px solid #D5DFED;
      background: white;
      max-width: 100%;
    }
  </style>
</head>
<body>

  <h2>Phase 3B.2 — forceCollide()</h2>
  <p>Watch how particles repel one another.</p>

  <svg id="force-lab" width="800" height="450"></svg>

  <script>
    const width = 800;
    const height = 450;
    const particleCount = 14;

    const svg = d3.select("#force-lab");
    
 // Phase 3B.5: Pointer tracking

 const pointer = {
   x: 0,
   y: 0,
   active: false
 };

 svg.on("pointermove", function(event) {
   const [x, y] = d3.pointer(event, this);

   pointer.x = x;
   pointer.y = y;
   pointer.active = true;

   simulation.alphaTarget(0.3).restart();
 });

 svg.on("pointerleave", function() {
   pointer.active = false;

   simulation.alphaTarget(0);
 });

    // 1. Create particle data
    const particles = d3.range(particleCount).map(() => ({
      x: width / 2 + (Math.random() - 0.5) * 40,
      y: height / 2 + (Math.random() - 0.5) * 40,
      r: 12 + Math.random() * 10,
      color: Math.random() > 0.5 ? "#87B9FF" : "#F2C96D"
    }));


    // 2. Bind particles to SVG circles
    const circles = svg
      .selectAll("circle")
      .data(particles)
      .join("circle")
      .attr("r", d => d.r)
      .attr("fill", d => d.color)
      .attr("opacity", 0.8);
// --------------------------------------
 // Phase 3B.5: Custom pointer repulsion
 // --------------------------------------

 function createPointerForce(pointer, radius = 120, strength = 8) {

   let nodes = [];

   function force(alpha) {

     if (!pointer.active) return;

     nodes.forEach(d => {

       const dx = d.x - pointer.x;
       const dy = d.y - pointer.y;

       const distance = Math.hypot(dx, dy);

       if (distance > 0.001 && distance < radius) {

         // Normalize the direction vector
         const directionX = dx / distance;
         const directionY = dy / distance;

         // Stronger force when closer to the pointer
         const intensity = 1 - distance / radius;

         // Apply changes to velocity
         d.vx += directionX * intensity * strength * alpha;
         d.vy += directionY * intensity * strength * alpha;
       }
     });
   }

   // D3 supplies the simulation's nodes
   force.initialize = function(_nodes) {
     nodes = _nodes;
   };

   return force;
 }
    
 // Phase 3B.4: Combining attraction and collision
 const simulation = d3.forceSimulation(particles)

   // Force 1: Pull particles toward one another
   .force(
     "charge",
     d3.forceManyBody().strength(20)
   )

   // Force 2: Prevent particles from overlapping
   .force(
     "collision",
     d3.forceCollide()
       .radius(d => d.r + 2)
       .strength(1)
       .iterations(3)
   )
    // Force 3: Pointer repulsion
  .force(
    "pointer",
    createPointerForce(pointer, 120, 8)
  )
   // Reduce excessive movement
   .velocityDecay(0.55)

   // Update circles after each simulation tick
   .on("tick", () => {
     circles
       .attr("cx", d => d.x)
       .attr("cy", d => d.y);
   });

 


  </script>

</body>
</html>
